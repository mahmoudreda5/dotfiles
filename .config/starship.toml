format = "$directory$git_branch$git_status$time$character"

[directory]
truncate_to_repo = false

[git_branch]
format = '[$branch]($style) '

[git_status]
format = '[$all_status$ahead_behind]($style) '

[time]
disabled = false
format = '[$time]($style) '

[character]
success_symbol = "❯ "
error_symbol = "✖ "
vimcmd_symbol = "❮ "
